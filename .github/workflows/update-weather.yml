name: Update Ann Arbor weather

on:
  schedule:
    # 14:17 UTC on the 3rd of every month
    - cron: "17 14 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download new days from NOAA
        run: python3 tools/fetch_ann_arbor.py

      - name: Rebuild the page
        run: python3 tools/build.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data docs weather-data.js
          git commit -m "Update Ann Arbor weather data"
          git push
